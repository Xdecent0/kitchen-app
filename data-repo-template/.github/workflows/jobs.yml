name: kitchen jobs

# The app cannot reach third-party origins from a browser, so it drops a job file
# into Задания/вход and this workflow answers it in Задания/выход.

on:
  push:
    paths:
      - "Задания/вход/**.json"
  # Rates are per day and the app cannot fetch them itself, so they arrive on a
  # schedule rather than being requested. 06:20 UTC: the National Bank publishes
  # the day's official rates in the morning.
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitchen-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR
        run: |
          if ls Задания/вход/*.json >/dev/null 2>&1 && grep -l '"receipt-ocr"' Задания/вход/*.json >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ukr tesseract-ocr-rus
          fi

      - name: Install Python deps
        run: |
          pip install --quiet requests beautifulsoup4 lxml pillow pytesseract
          # Safari has no BarcodeDetector, so an iPhone photographs the QR and
          # the decoding happens here. headless keeps it to one wheel, no X11.
          if ls Задания/вход/*.json >/dev/null 2>&1 && grep -l '"receipt-qr-photo"' Задания/вход/*.json >/dev/null 2>&1; then
            pip install --quiet opencv-python-headless numpy
          fi

      - name: Run pending jobs
        run: python scripts/run_jobs.py

      - name: Refresh exchange rates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/run_jobs.py --rates

      - name: Commit answers
        run: |
          git config user.name "kitchen-bot"
          git config user.email "kitchen-bot@users.noreply.github.com"
          git add -A "Задания" "Состояние/курсы.json" || git add -A "Задания"
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "kitchen: ответы на задания"
            # The app writes to this repo too, so a rebase beats a failed push.
            git pull --rebase --quiet || true
            git push
          fi
