<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3327">
<title>Кухня</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-list" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></g>
    <g id="i-stock" fill="none" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M5 11h14M9.5 6.5v2"/></g>
    <g id="i-recipes" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M7 4v7a5 5 0 0 0 10 0V4"/><path d="M12 16v4"/></g>
    <g id="i-receipts" fill="none" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6M9 13h6"/></g>
    <g id="i-check" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7"/></g>
    <g id="i-plus" fill="none" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-freezer" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M4 7.5l16 9M20 7.5l-16 9"/></g>
    <g id="i-shelf" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18M8 6v6M15 12v6"/></g>
    <g id="i-veg" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M6 10h12l-1.4 9.5H7.4z"/><path d="M9 10c0-3 1.4-5.5 3-5.5S15 7 15 10"/></g>
    <g id="i-carton" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M5 8h11l3 4v4H5z"/><path d="M5 12h14"/></g>
  </defs>
</svg>

<div class="app">

  <main class="screen" id="screen-list" data-active>
    <div class="statusbar">
      <span class="num" data-clock>—</span>
      <span class="conn" data-conn data-state="online">на связи</span>
    </div>
    <header class="head">
      <div class="head-row">
        <h1>Магазин</h1>
        <span class="head-sub num" data-list-count>0 / 0</span>
      </div>
      <div class="bar"><i data-list-bar></i></div>
    </header>
    <div class="body" data-list-body></div>
    <div class="foot">
      <button class="btn btn--grow" data-act="scan">Сканировать чек</button>
      <button class="icon-btn" data-act="add" aria-label="Добавить в список">
        <svg width="22" height="22" viewBox="0 0 24 24" stroke="#1c3327" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
    </div>
  </main>

  <main class="screen" id="screen-stock">
    <header class="head head--dark">
      <div>
        <h1>Склад</h1>
        <span class="head-sub num" data-stock-sub>пусто</span>
      </div>
      <div class="chips" role="group" aria-label="Фильтр склада">
        <button class="chip" data-filter="all" aria-pressed="true">всё</button>
        <button class="chip" data-filter="burning" aria-pressed="false">горит</button>
        <button class="chip" data-filter="low" aria-pressed="false">кончается</button>
      </div>
    </header>
    <div class="body" data-stock-body></div>
    <div class="foot">
      <button class="btn btn--grow" data-act="audit">Ревизия · 20 сек</button>
    </div>
  </main>

  <main class="screen" id="screen-recipes">
    <header class="head"><h1>Что приготовить</h1></header>
    <div class="body">
      <div class="empty">
        <h2>Рецептов пока нет</h2>
        <p>Рецепты живут markdown-файлами в волте, в папке <code>30 - Личное/Кухня</code>. Приложение будет сверять их со складом и показывать, что можно готовить прямо сейчас.</p>
        <p>Появятся, когда подключим репозиторий данных.</p>
      </div>
    </div>
  </main>

  <main class="screen" id="screen-receipts">
    <header class="head"><h1>Чеки</h1></header>
    <div class="body" data-receipts-body></div>
  </main>

  <nav class="tabs" aria-label="Разделы">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">К</span>
      <span class="brand-name">Кухня</span>
    </div>
    <button class="tab" data-tab="list" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-list"/></svg>
      <span>Список</span>
      <span class="tab-badge" data-badge-list hidden>0</span>
    </button>
    <button class="tab" data-tab="stock">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-stock"/></svg>
      <span>Склад</span>
      <span class="tab-badge" data-badge-stock hidden>0</span>
    </button>
    <button class="tab" data-tab="recipes">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-recipes"/></svg>
      <span>Рецепты</span>
    </button>
    <button class="tab" data-tab="receipts">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-receipts"/></svg>
      <span>Чеки</span>
    </button>
  </nav>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
